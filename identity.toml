# COMPITUM public identity — the single source of truth.
#
# # How to use this file
#
# When the domain is registered, fill in `domain` below and run:
#
#     python3 tools/identity.py
#
# Every reference across the repository updates from this one file, and
# `python3 tools/identity.py --check` fails CI if anything drifts out of sync.
# Nothing here is a secret; every value is already public.

[identity]

# The primary domain, without a scheme. Leave empty until it is registered.
#
# While it is empty the repository URL is used as the project's home, so every
# published artefact already points somewhere that resolves. Nothing breaks.
#
# Example once purchased:
#   domain = "compitum.dev"
domain = ""

# The Oracle API base, published only once the service is actually deployed.
#
# Deliberately NOT derived from `domain`. Registering a domain and running an API are two
# different facts, and inferring the second from the first would publish a dead endpoint in
# the machine-readable identity block the moment the domain is bought. Leave empty until
# `api.<domain>` resolves and answers; then set it, e.g.:
#   api_base = "https://api.compitum.dev"
api_base = ""

# The canonical source repository. This never changes, even after the domain exists:
# a source link should point at the source.
repository = "https://github.com/compitum-dev/compitum"

# The human-facing contact address.
#
# This is NOT derived from `domain`, on purpose. Buying a domain and having mail forwarding
# work are different facts: a security report sent to a mailbox that does not exist yet is a
# harm with no upside. When forwarding is live, change this one field to `hello@<domain>`
# (keeping the Gmail address as the forwarding source), re-run the tool, and every document
# follows -- `tools/identity.py --check` fails if any of them disagrees.
contact_email = "compitum.dev@gmail.com"

# The name used in prose and in package descriptions.
product_name = "COMPITUM"

# The GitHub organisation. Used by the container namespace, which inherits it.
github_org = "compitum-dev"

# The tagline, kept here so README, npm and PyPI cannot describe the project
# differently from each other.
tagline = "The universal ARM64 compatibility layer: ABI-aware classification and routing for ARM64 Windows binaries."

# The licence identifier used in every published manifest. SPDX form.
license = "MIT OR Apache-2.0"

# A one-line legal attribution line reused in manifests.
copyright = "The COMPITUM Project and contributors"
