name: ARM64EC probe

# Answers one question in about five minutes, before committing hours to a build:
#
#   Can the Wine that the runner already ships execute an ARM64EC binary?
#
# # Why this exists
#
# The full ARM64EC build takes hours, and a previous attempt stalled after 2h35m. Two facts
# make a cheaper check available first:
#
#   1. Wine 9.0's release notes state the loader "supports loading ARM64X and ARM64EC
#      modules", and Wine 10.0 says "the ARM64EC architecture is fully supported".
#   2. The runner is ubuntu-24.04-arm, whose archive carries Wine 9.0 for arm64.
#
# Checking costs minutes; building costs hours.
#
# # The measurement lives in a script
#
# `tools/probe-arm64ec.sh` holds all the logic, so it can be run and validated locally --
# which is how two bugs in it were found without spending CI minutes. The workflow only
# installs Wine, builds the tool and calls the script.
#
# Version history of the probe, because each defect taught something:
#
#   1. `command -v wine64 || command -v wine` fell through to the `wine` wrapper, which on a
#      64-bit-only install prints "it looks like wine32 is missing" and exits.
#   2. The verdict step ended with `echo "::error::"`, which LOOKS like a failure annotation
#      but does not set a non-zero status -- so the job reported success while four of seven
#      fixtures disagreed. A false pass.
#   3. `set -e` aborted the loader test, because it executes a junk file *on purpose* and that
#      command returns non-zero by design.
#   4. A `wineserver` daemon inherited the step's file descriptors and kept the step alive for
#      43 minutes after its work was done.
#   5. CPU growth was measured from `/proc`, which under the container reports only the
#      container's own interpreter -- so every reading was +0, including for a binary already
#      proven to execute. The instrument, not the subject, was broken.
#
#      **That conclusion was too broad, and correcting it is the sixth entry.** `loopcheck.sh`
#      took a *host-wide* reading through `ps`, which in this container sees nothing. Reading
#      `/proc/<pid>/stat` for the process we spawned ourselves works, provided the reading
#      covers the whole **descendant tree**: under Wine the direct child is a thin launcher and
#      a child-only reading is zero every time -- the same zero, for the same wrong reason, as
#      the failure it was written off for.
#   6. **The timeout alone was not sufficient evidence, and this was the defect that mattered.**
#      `tools/measure-timeout-signal.sh` found a sixteen-byte file containing only the `MZ`
#      signature -- and a plain text file -- hitting the deadline and returning 124 in **12 of 32
#      trials**. Wine's own start-up can outlast the deadline, so "still running" has
#      two explanations and only one is about the binary. A deadline of 20 s did not separate
#      them either (2 of 21 negative runs still hit it).
#
#      The fix is a second, independent signal: CPU time consumed by the process tree in a
#      window that opens **after start-up has settled**. Measured separation over a 4 s tail
#      windows: 256/253/242/204 ticks for the looping fixture (and once 0, recorded rather than
#      smoothed away), and never above 1 tick for a file Wine cannot run.
#   7. The first attempt at that second signal sampled at exactly the deadline, so the last
#      reading landed after the process was reaped and every value came back 0 -- and without a
#      warm-up the first execution in a fresh prefix spends its entire allowance initialising
#      the prefix, which is indistinguishable from a blocked loader. Warm-up is a precondition
#      of the method, not a nicety, and the final sample must land before the kill.
#   8. The threshold was scaled by `getconf CLK_TCK` on top of a value that was already in clock
#      ticks, so a genuine 112 ticks/s was reported as 12725 -- 100x too large, in the direction
#      that would make a blocked loader look busy.
#
# Every one of those was the measurement reporting something other than what happened. That is
# the same failure mode as the PE offset bug, the CHPE misidentification, and the three scanner
# rules that could never fire -- so it is worth naming: establish that the instrument works
# before trusting what it measures.
#
# # The probe now proves it can refuse
#
# Because entry 6 showed the old criterion accepted a file nobody can run, the probe carries a
# **negative control**: a 16-byte `MZ`-only file, built at run time. If that file ever satisfies
# the criterion the run stops immediately, because a check that cannot reject an unrunnable file
# has no standing to accept one nobody has seen run.

on:
  workflow_dispatch:
  push:
    paths:
      - 'crates/compitum-pe/tests/corpus/**'
      - 'tools/probe-arm64ec.sh'
      - 'tools/loopcheck.sh'
      # The measurements that establish whether the probe's criterion can be trusted. They are
      # triggers in their own right because a change to either changes what the probe means.
      - 'tools/measure-timeout-signal.sh'
      - 'tools/measure-cpu-signal.sh'
      - '.github/workflows/wine-probe.yml'

jobs:
  probe:
    name: can the runner's Wine run ARM64EC?
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    env:
      # Disable Mono and Gecko. Installing either tries to DOWNLOAD from the internet, which
      # hung an earlier run for 43 minutes. Neither is needed to execute a binary.
      WINEDLLOVERRIDES: "mscoree,mshtml="
      WINEDEBUG: "-all"

    steps:
      - uses: actions/checkout@v4

      - name: Install the runner's Wine
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wine64 libwine 2>&1 | tail -3
          echo "--- installed ---"
          dpkg -l | grep -i '^ii.*wine' | awk '{print "  ", $2, $3, $4}' || true

      - name: Build the classifier
        run: |
          cargo build --release --all-targets
          ./target/release/compitum --version

      - name: Run the probe
        id: probe
        run: |
          mkdir -p /tmp/corpus
          cp crates/compitum-pe/tests/corpus/*.exe /tmp/corpus/
          echo "--- corpus ---"
          ls -1 /tmp/corpus/

          chmod +x tools/probe-arm64ec.sh
          # `set +e` so the script's non-zero status becomes data rather than an abort; the
          # verdict step below decides what it means.
          set +e
          sh tools/probe-arm64ec.sh /tmp/corpus 2>&1 | tee /tmp/probe.log
          code=${PIPESTATUS[0]}
          set -e
          echo "probe exit: $code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Verdict
        run: |
          CODE="${{ steps.probe.outputs.code }}"
          WINELINE=$(grep -m1 "wine-" /tmp/probe.log || echo "unknown Wine")

          if [ "$CODE" = "0" ]; then
            {
              echo "### ARM64EC works on the runner's Wine"
              echo
              echo "\`$WINELINE\`"
              echo
              echo "**No build is needed.** The loader installed by apt executed the ARM64EC"
              echo "fixture, with the control passing first so the result is trustworthy."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Anything else means ARM64EC did not execute. That is the evidence that justifies
          # building Wine from source -- a real result, not a workflow failure.
          {
            echo "### ARM64EC did not execute on the runner's Wine"
            echo
            echo "\`$WINELINE\`"
            echo
            echo "This justifies building Wine from source. See"
            echo "\`docs/BUILDING-ARM64EC-WINE.md\`."
          } >> "$GITHUB_STEP_SUMMARY"

          # An explicit `exit 1`. `echo "::error::"` looks like a failure annotation but does
          # not set a non-zero status, which once let this job report success while the probe
          # had failed -- the exact false-pass defect listed in the header.
          echo "::error::ARM64EC was not executed by the runner's Wine; see the summary"
          exit 1
