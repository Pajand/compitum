name: ARM64EC probe

# Answers one question in about five minutes, before committing hours to a build:
#
#   Can the Wine that the runner already ships execute an ARM64EC binary?
#
# # Why this exists
#
# The full ARM64EC build takes hours, and a previous attempt stalled after 2h35m. Two facts
# make a cheaper check available first:
#
#   1. Wine 9.0's release notes state the loader "supports loading ARM64X and ARM64EC
#      modules", and Wine 10.0 says "the ARM64EC architecture is fully supported".
#   2. The runner is ubuntu-24.04-arm, whose archive carries Wine 9.0 for arm64.
#
# Checking costs minutes; building costs hours. Checking first is the cheaper order of
# operations -- the same reasoning that turned Phase 1's "we must build Wine" into "Wine
# 6.0.3 is already here and it works" for the native case.
#
# # Two defects this workflow had, and what they taught
#
# 1. `command -v wine64 || command -v wine` fell through to the `wine` **wrapper**, because
#    Ubuntu's wine64 package does not install a `wine64` on PATH -- the loader lives at
#    `/usr/lib/wine/wine64`. The wrapper then failed to launch anything, and every fixture
#    measured +0 jiffies. The workflow now locates the loader explicitly and *proves* it
#    works on a known-good binary before measuring anything.
#
# 2. The verdict step ended with `echo "::error::..."`, which looks like a failure annotation
#    but does **not** set a non-zero exit status. The job therefore reported SUCCESS while
#    four of seven fixtures disagreed. That is a false pass, and it is the same defect shape
#    as every other one found in this project: a check reporting success without having
#    verified anything. The step now exits non-zero.
#
# # What each outcome means
#
#   PASS  -> the ARM64EC loader works here; the full build is unnecessary
#   FAIL  -> the build is required, and this run says so with evidence

on:
  workflow_dispatch:
  push:
    paths:
      - 'crates/compitum-pe/tests/corpus/**'
      - 'tools/loopcheck.sh'
      - '.github/workflows/wine-probe.yml'

jobs:
  probe:
    name: can the runner's Wine run ARM64EC?
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    env:
      # Disable Mono and Gecko. A prefix initialisation otherwise tries to DOWNLOAD both
      # from the internet, which is what hung this job for 30 minutes on work that should
      # take two. Neither is needed to execute a native or ARM64EC binary.
      WINEDLLOVERRIDES: "mscoree,mshtml="
      # Silence Wine's own chatter so the diagnostic output stays readable.
      WINEDEBUG: "-all"

    steps:
      - uses: actions/checkout@v4

      - name: Install the runner's Wine
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wine64 libwine 2>&1 | tail -3
          echo "--- installed ---"
          dpkg -l | grep -i '^ii.*wine' | awk '{print "  ", $2, $3, $4}' || true

      - name: Locate the Wine loader, and prove it runs
        id: wine
        run: |
          # Ubuntu's wine64 package does not put a `wine64` on PATH. An earlier revision used
          # `command -v wine64 || command -v wine`, which silently fell through to the wrapper;
          # the wrapper then launched nothing and every measurement read +0. So each candidate
          # is tested, not assumed.
          CANDIDATES="
          /usr/lib/wine/wine64
          /usr/bin/wine64
          /usr/bin/wine
          "
          FOUND=""
          for c in $CANDIDATES; do
            [ -x "$c" ] || continue
            echo "--- trying $c"
            # `set +e` around every deliberately-failing command. GitHub runs `run:` blocks
            # with `bash -e`, and the loader test executes a junk file *on purpose* to see
            # whether Wine can launch a program at all. That command returns non-zero by
            # design, so without this the script aborted before it could report why -- which
            # is exactly what happened on the first run of this step: it found Wine 9.0,
            # printed the version, and exited 1 with no explanation.
            set +e
            "$c" --version >/tmp/ver.txt 2>&1
            vrc=$?
            set -e

            if [ "$vrc" -eq 0 ]; then
              echo "    reported: $(head -1 /tmp/ver.txt)"
              # Reporting a version is not sufficient evidence: the wrapper prints one even
              # when it cannot launch anything. So a real program is executed as the test.
              printf 'MZ placeholder' > /tmp/notpe.exe
              set +e
              WINEPREFIX=/tmp/wp-probe "$c" /tmp/notpe.exe >/dev/null 2>&1
              rc=$?
              set -e
              if [ "$rc" -ne 127 ] && [ "$rc" -ne 126 ]; then
                echo "    launched a program (exit $rc) -- accepting"
                FOUND="$c"
                break
              fi
              echo "    could not launch a program (exit $rc)"
            else
              echo "    --version failed (exit $vrc)"
            fi
          done

          if [ -z "$FOUND" ]; then
            echo "::error::no usable Wine on this runner"
            echo "The build is therefore required. This is a real result, not a failure of the probe."
            exit 1
          fi
          echo "WINE_BIN=$FOUND" >> "$GITHUB_ENV"
          echo "using: $FOUND"
          "$FOUND" --version 2>&1 | head -1

      - name: Build the tool
        run: |
          cargo build --release --all-targets
          ./target/release/compitum --version

      - name: Diagnose which Wine entry point can execute a program
        id: diagnose
        run: |
          # The previous attempt reported +0 jiffies with EMPTY stderr, which says nothing
          # about why. This step is deliberately a *diagnostic*: it tries each candidate,
          # keeps full stderr, and prints a verdict. Guessing here costs hours.
          mkdir -p /tmp/corpus-ci
          cp crates/compitum-pe/tests/corpus/*.exe /tmp/corpus-ci/
          SAMPLE=/tmp/corpus-ci/real-console-4k.exe
          echo "sample: $SAMPLE  ($(stat -c%s "$SAMPLE") bytes, plain ARM64, proven to run)"

          cpu_growth() {   # $1 = process-name fragment; prints jiffies after 4 s
            local name="$1" first=0 second=0 p cmd stat rest
            sleep 4
            for p in /proc/[0-9]*; do
              cmd=$(tr '\0' ' ' < "$p/cmdline" 2>/dev/null) || continue
              case "$cmd" in *"$name"*) stat=$(cat "$p/stat" 2>/dev/null) || continue
                rest=${stat#*) }; set -- $rest
                first=$(( first + ${12:-0} + ${13:-0} )) ;; esac
            done
            sleep 4
            for p in /proc/[0-9]*; do
              cmd=$(tr '\0' ' ' < "$p/cmdline" 2>/dev/null) || continue
              case "$cmd" in *"$name"*) stat=$(cat "$p/stat" 2>/dev/null) || continue
                rest=${stat#*) }; set -- $rest
                second=$(( second + ${12:-0} + ${13:-0} )) ;; esac
            done
            echo $(( second - first ))
          }

          WINNER=""
          WORKER=""
          for CANDIDATE in /usr/bin/wine64 /usr/bin/wine /usr/lib/wine/wine64; do
            [ -x "$CANDIDATE" ] || continue
            echo
            echo "=== $CANDIDATE ==="

            PREFIX="/tmp/wp-try-$(basename "$CANDIDATE")"
            rm -rf "$PREFIX"; mkdir -p "$PREFIX"
            export WINEPREFIX="$PREFIX"

            # The raw loader at /usr/lib/wine/wine64 is not a wrapper: it does not know
            # where its own DLLs live, so it needs telling. Without these it exits
            # immediately, which reads as "cannot execute" and is not that.
            if [ "$CANDIDATE" = "/usr/lib/wine/wine64" ]; then
              export WINELOADER="$CANDIDATE"
              export WINEDLLPATH="/usr/lib/aarch64-linux-gnu/wine:/usr/lib/wine"
              echo "    (set WINELOADER and WINEDLLPATH for the raw loader)"
            fi
            # WINEDEBUG is deliberately NOT suppressed here: silent output is what made the
            # previous failure unreadable.
            export WINEDEBUG=fixme-all,err+all

            echo "--- version ---"
            set +e; "$CANDIDATE" --version 2>&1 | head -2; set -e

            echo "--- wineboot (initialise the prefix) ---"
            set +e; timeout 90 "$CANDIDATE" wineboot -i >/tmp/boot.log 2>&1; bc=$?; set -e
            echo "    exit $bc"
            grep -iE "wine32|error|cannot|missing" /tmp/boot.log | head -4 | sed 's/^/    /'

            echo "--- executing the sample ---"
            set +e
            "$CANDIDATE" "$SAMPLE" >/tmp/run.log 2>&1 &
            set -e
            growth=$(cpu_growth "real-console-4k")
            echo "    CPU growth: +$growth jiffies in 4 s"
            head -6 /tmp/run.log | sed 's/^/    /'
            "$CANDIDATE" wineserver -k >/dev/null 2>&1 || true
            pkill -f real-console 2>/dev/null || true
            sleep 1

            if [ "$growth" -ge 150 ]; then
              echo "    ==> WORKS"
              [ -z "$WINNER" ] && WINNER="$CANDIDATE"
              WORKER="$CANDIDATE"
              break
            fi
            echo "    ==> cannot execute"
          done

          if [ -n "$WINNER" ]; then
            echo "WINE_BIN=$WINNER" >> "$GITHUB_ENV"
            echo "usable Wine: $WINNER"
            echo "usable=$WINNER" >> "$GITHUB_OUTPUT"
          else
            echo "::error::no Wine entry point on this runner could execute a plain ARM64 binary"
            echo "This is an environment result, not an ARM64EC verdict."
            echo "usable=" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Confirm the toolchain can execute ARM64 before judging ARM64EC
        run: |
          # A known-good case first. `real-console-4k.exe` is plain ARM64 and was already
          # proven to execute under Wine 6.0.3 during Phase 1. If it does not run here, the
          # environment is wrong and no conclusion about ARM64EC can be drawn from this run.
          export WINEPREFIX=/tmp/wp-final WINEDEBUG=-all
          rm -rf "$WINEPREFIX"
          # Bounded, for the same reason as the diagnostic's: an unbounded wineboot once
          # consumed 30 minutes of this job's budget trying to fetch Mono and Gecko.
          WINEDLLOVERRIDES="mscoree,mshtml=" timeout 60 "$WINE_BIN" wineboot -i >/dev/null 2>&1 || true
          "$WINE_BIN" wineserver -k >/dev/null 2>&1 || true
          sleep 2

          "$WINE_BIN" /tmp/corpus-ci/real-console-4k.exe >/dev/null 2>&1 &
          sleep 4; a=0
          for p in /proc/[0-9]*; do
            cmd=$(tr '\0' ' ' < "$p/cmdline" 2>/dev/null) || continue
            case "$cmd" in *real-console-4k*) st=$(cat "$p/stat" 2>/dev/null) || continue
              rest=${st#*) }; set -- $rest; a=$(( a + ${12:-0} + ${13:-0} )) ;; esac
          done
          sleep 4; b=0
          for p in /proc/[0-9]*; do
            cmd=$(tr '\0' ' ' < "$p/cmdline" 2>/dev/null) || continue
            case "$cmd" in *real-console-4k*) st=$(cat "$p/stat" 2>/dev/null) || continue
              rest=${st#*) }; set -- $rest; b=$(( b + ${12:-0} + ${13:-0} )) ;; esac
          done
          "$WINE_BIN" wineserver -k >/dev/null 2>&1 || true
          pkill -f real-console 2>/dev/null || true

          echo "  CPU growth: +$((b - a)) jiffies in 4 s"
          if [ $((b - a)) -lt 150 ]; then
            echo "::error::the control did not execute; ARM64EC cannot be judged from this run"
            exit 1
          fi
          echo "control passed: this environment executes ARM64"

      - name: Run the prediction-versus-observation check
        id: loopcheck
        run: |
          chmod +x tools/loopcheck.sh
          export WINE="$WINE_BIN"
          export WINEPREFIX=/tmp/wp-probe
          set +e
          sh tools/loopcheck.sh ./target/release/compitum /tmp/corpus-ci
          code=$?
          set -e
          echo "loopcheck exit: $code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Verdict
        run: |
          CODE="${{ steps.loopcheck.outputs.code }}"

          if [ "$CODE" = "0" ]; then
            {
              echo "### ARM64EC works on the runner's Wine"
              echo
              echo "No build needed. Wine $( "$WINE_BIN" --version 2>&1 | head -1 ) handled every"
              echo "corpus file, including the ARM64EC fixture, matching every routing prediction."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "### ARM64EC did not work on the runner's Wine"
            echo
            echo "This is the evidence that justifies building Wine from source."
            echo "The control case passed, so the environment is sound and the failure is real."
          } >> "$GITHUB_STEP_SUMMARY"

          # `echo "::error::..."` looks like a failure annotation but does NOT set a non-zero
          # exit status. An earlier revision ended here, so the job reported SUCCESS while four
          # of seven fixtures disagreed -- a false pass. An explicit exit is the fix.
          echo "::error::ARM64EC was not executed by the runner's Wine"
          exit 1
