[workspace]
resolver = "2"
members = [
    "crates/compitum-json",
    "crates/compitum-i18n",
    "crates/compitum-isa",
    "crates/compitum-pe",
    "crates/compitum-router",
    "crates/compitum-oracle",
    "crates/compitum-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/Pajand/compitum"
homepage = "https://github.com/Pajand/compitum"
authors = ["The COMPITUM Project"]
description = "ABI-aware ARM64 compatibility layer: classify, verify, route."

[workspace.dependencies]
compitum-json = { path = "crates/compitum-json" }
compitum-i18n = { path = "crates/compitum-i18n" }
compitum-isa = { path = "crates/compitum-isa" }
compitum-pe = { path = "crates/compitum-pe" }
compitum-router = { path = "crates/compitum-router" }
compitum-oracle = { path = "crates/compitum-oracle" }

# Zero external dependencies, by design. See ROADMAP Law 5: the workspace must build
# offline and stay trivially auditable.

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
