[package]
name = "compitum-pe"
description = "PE/COFF parsing and ARM64 binary classification for COMPITUM."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

readme = "README.md"
keywords = ["pe", "coff", "executable", "arm64", "binary-analysis"]
categories = ["parser-implementations", "parsing", "os::windows-apis"]

[dependencies]
compitum-json = { workspace = true }
compitum-isa = { workspace = true }

[dev-dependencies]
# Used only by `tests/real_toolchain.rs`, to verify that the committed corpus files match the
# digests recorded in their manifest. A dev-dependency keeps it out of the published
# dependency graph for consumers.
compitum-digest = { workspace = true }
